# Based on this tutorial: https://docs.docker.com/guides/dotnet/develop/

services:
  server:
    build:
      context: .
      target: final
    ports:
      - 8081:8080
    environment:
        AppSettings__Secret: ${SECRET}
        ConnectionStrings__ShoppingListAPIContext: Server=db,1433;Database=master;MultipleActiveResultSets=true;TrustServerCertificate=True;User Id=sa;Password=${SA_PASSWORD};
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    volumes:
      - db-data:/var/opt/mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Express
    expose:
      - 1433
    healthcheck:
      test: [
        "CMD-SHELL",
        "pgrep sqlservr || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
volumes:
  db-data: